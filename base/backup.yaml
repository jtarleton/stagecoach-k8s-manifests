# Nightly logical backup of the Drupal database to the db-backups volume.
# Dumps are verified before they replace anything; the newest $KEEP are kept.
# Restore with scripts/db-restore.sh; run one now with scripts/db-backup-now.sh.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backups
  labels: {app.kubernetes.io/name: db-backup}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 5Gi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  labels: {app.kubernetes.io/name: db-backup}
spec:
  schedule: "15 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: {app.kubernetes.io/name: db-backup, app.kubernetes.io/component: backup}
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: dump
              # Same image as the server, so mariadb-dump always matches it.
              image: docker.io/library/mariadb:11.8.8
              env:
                - {name: DB_HOST, value: mariadb}
                - {name: DB_NAME, value: drupal}
                - {name: DB_USER, value: drupal}
                - name: DB_PASSWORD
                  valueFrom: {secretKeyRef: {name: mariadb, key: password}}
                - {name: KEEP, value: "14"}
              command:
                - bash
                - -ec
                - |
                  set -o pipefail
                  umask 077
                  # Credentials via a file, never on the command line.
                  printf '[client]\nhost=%s\nuser=%s\npassword=%s\n' "$DB_HOST" "$DB_USER" "$DB_PASSWORD" > /tmp/my.cnf

                  # Fresh pods can briefly lose the race with NetworkPolicy setup.
                  for i in $(seq 1 30); do
                    mariadb-admin --defaults-extra-file=/tmp/my.cnf ping >/dev/null 2>&1 && break
                    sleep 1
                  done

                  name="drupal-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  tmp="/backups/.${name}.partial"
                  mariadb-dump --defaults-extra-file=/tmp/my.cnf \
                    --single-transaction --quick --routines --triggers --events \
                    --hex-blob --default-character-set=utf8mb4 "$DB_NAME" | gzip -6 > "$tmp"

                  # Only a complete, readable dump may become a backup.
                  gzip -t "$tmp"
                  zcat "$tmp" | tail -n 1 | grep -q '^-- Dump completed' || { echo "dump incomplete" >&2; rm -f "$tmp"; exit 1; }
                  mv "$tmp" "/backups/$name"
                  sha256sum "/backups/$name" | sed 's#/backups/##' > "/backups/$name.sha256"

                  # Retention by count, so failing nights never age out good dumps.
                  ls -1t /backups/drupal-*.sql.gz | tail -n +$((KEEP + 1)) | while read -r old; do
                    rm -f "$old" "$old.sha256"
                  done
                  rm -f /backups/.*.partial

                  echo "backup ok: $name ($(du -h "/backups/$name" | cut -f1)), $(ls -1 /backups/drupal-*.sql.gz | wc -l) kept"
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: backups, mountPath: /backups}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: backups
              persistentVolumeClaim: {claimName: db-backups}
            - name: tmp
              emptyDir: {sizeLimit: 16Mi}
