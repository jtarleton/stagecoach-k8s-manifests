apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels: {app.kubernetes.io/name: mariadb}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: mariadb}
  ports:
    - {name: mysql, port: 3306, targetPort: mysql}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  labels: {app.kubernetes.io/name: mariadb}
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mariadb}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mariadb, app.kubernetes.io/component: database}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mariadb
          image: docker.io/library/mariadb:11.8.8
          env:
            - {name: MARIADB_DATABASE, value: drupal}
            - {name: MARIADB_USER, value: drupal}
            - name: MARIADB_PASSWORD
              valueFrom: {secretKeyRef: {name: mariadb, key: password}}
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: mariadb, key: root-password}}
            # Run mariadb-upgrade automatically when the image version changes.
            - {name: MARIADB_AUTO_UPGRADE, value: "1"}
          ports:
            - {name: mysql, containerPort: 3306}
          startupProbe:
            exec: {command: [healthcheck.sh, --connect, --innodb_initialized]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [healthcheck.sh, --connect, --innodb_initialized]}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [healthcheck.sh, --connect]}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 448Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: config, mountPath: /etc/mysql/conf.d/zz-stagecoach.cnf, subPath: mariadb.cnf, readOnly: true}
            - {name: run, mountPath: /run/mysqld}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: mariadb-config}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 5Gi}
