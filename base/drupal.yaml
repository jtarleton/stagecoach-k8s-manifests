apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drupal-files
  labels: {app.kubernetes.io/name: drupal}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: drupal
  labels: {app.kubernetes.io/name: drupal}
spec:
  selector: {app.kubernetes.io/name: drupal}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drupal
  labels: {app.kubernetes.io/name: drupal}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Single node, so the RWO files volume can be shared during a rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: drupal}
  template:
    metadata:
      labels: {app.kubernetes.io/name: drupal, app.kubernetes.io/component: app, stagecoach.sh/php: "true"}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frankenphp
          image: localhost/stagecoach/drupal
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: drupal-env}
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: mariadb, key: password}}
            - name: DRUPAL_HASH_SALT
              valueFrom: {secretKeyRef: {name: drupal, key: hash-salt}}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis-auth, key: password}}
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            timeoutSeconds: 3
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            timeoutSeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            timeoutSeconds: 3
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 200m, memory: 192Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: files, mountPath: /app/web/sites/default/files, subPath: public}
            - {name: files, mountPath: /app/private, subPath: private}
            - {name: tmp, mountPath: /tmp}
            - {name: caddy-data, mountPath: /data}
            - {name: caddy-config, mountPath: /config}
      volumes:
        - name: files
          persistentVolumeClaim: {claimName: drupal-files}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        - name: caddy-data
          emptyDir: {sizeLimit: 16Mi}
        - name: caddy-config
          emptyDir: {sizeLimit: 16Mi}
