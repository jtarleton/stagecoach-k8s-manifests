apiVersion: v1
kind: Namespace
metadata:
  name: stagecoach
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    # What the stagecoach.sh agent reports this namespace as (agent/).
    stagecoach.sh/application: stagecoach-sh
    stagecoach.sh/environment: prod
