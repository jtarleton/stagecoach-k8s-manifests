apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stagecoach
labels:
  - pairs:
      app.kubernetes.io/part-of: stagecoach
    includeSelectors: false
resources:
  - namespace.yaml
  - mariadb.yaml
  - redis.yaml
  - drupal.yaml
  - varnish.yaml
  - cron.yaml
  - backup.yaml
  - networkpolicies.yaml
configMapGenerator:
  - name: mariadb-config
    files: [config/mariadb.cnf]
  - name: varnish-vcl
    files: [config/default.vcl]
  - name: drupal-env
    literals:
      - DB_HOST=mariadb
      - DB_NAME=drupal
      - DB_USER=drupal
      - REDIS_HOST=redis
      - DRUPAL_TRUSTED_HOSTS=stagecoach.sh
      - DRUPAL_REVERSE_PROXY_ADDRESSES=10.42.0.0/16
      - FRANKENPHP_NUM_THREADS=4
      - DRUSH_OPTIONS_URI=https://stagecoach.sh
      - STAGE_COACH_URL=http://stage-coach.stage-coach.svc:8080
      - STAGECOACH_GO_URL=http://stage-coach.stage-coach.svc:8080
images:
  - name: localhost/stagecoach/drupal
    newTag: "202610240112-dc14cb4"
