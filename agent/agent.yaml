# Rendered from the published chart repository, exactly as a customer runs it:
#   helm repo add stagecoach https://charts.stagecoach.sh
#   helm template stagecoach-agent stagecoach/stagecoach-agent --version 0.2.0 -n stagecoach-agent \
#     --set clusterName=crystalbit-us --set provider=Vultr --set existingSecret=stagecoach-agent-token
# The image (ghcr.io/jtarleton/stagecoach-agent) is public: no pull secret.
# Reports via https://api.stagecoach.sh (Cloudflare -> edge -> stage-coach). The token secret is
# minted from the portal (sc-admin org), never committed.
---
# Source: stagecoach-agent/templates/rbac.yaml
# The agent reads, cluster-wide, exactly what it reports: nodes (and whether
# they are Ready), pods (how many are live), namespaces (their
# stagecoach.sh/application and stagecoach.sh/environment labels). Nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stagecoach-agent
  namespace: stagecoach-agent
  labels:
    app.kubernetes.io/name: stagecoach-agent
    app.kubernetes.io/instance: stagecoach-agent
    app.kubernetes.io/version: "d434052b04f3e091e53c9af1cf219c27347543c6"
---
# Source: stagecoach-agent/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stagecoach-agent
  labels:
    app.kubernetes.io/name: stagecoach-agent
    app.kubernetes.io/instance: stagecoach-agent
    app.kubernetes.io/version: "d434052b04f3e091e53c9af1cf219c27347543c6"
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces]
    verbs: [list]
---
# Source: stagecoach-agent/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stagecoach-agent
  labels:
    app.kubernetes.io/name: stagecoach-agent
    app.kubernetes.io/instance: stagecoach-agent
    app.kubernetes.io/version: "d434052b04f3e091e53c9af1cf219c27347543c6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stagecoach-agent
subjects:
  - kind: ServiceAccount
    name: stagecoach-agent
    namespace: stagecoach-agent
---
# Source: stagecoach-agent/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stagecoach-agent
  namespace: stagecoach-agent
  labels:
    app.kubernetes.io/name: stagecoach-agent
    app.kubernetes.io/instance: stagecoach-agent
    app.kubernetes.io/version: "d434052b04f3e091e53c9af1cf219c27347543c6"
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: stagecoach-agent, app.kubernetes.io/instance: stagecoach-agent}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stagecoach-agent
        app.kubernetes.io/instance: stagecoach-agent
        app.kubernetes.io/version: "d434052b04f3e091e53c9af1cf219c27347543c6"
    spec:
      serviceAccountName: stagecoach-agent
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: ghcr.io/jtarleton/stagecoach-agent:d434052b04f3e091e53c9af1cf219c27347543c6
          imagePullPolicy: IfNotPresent
          args: [-interval=60s]
          env:
            - {name: STAGECOACH_SERVER, value: "https://api.stagecoach.sh"}
            - {name: STAGECOACH_CLUSTER_NAME, value: "crystalbit-us"}
            - {name: STAGECOACH_PROVIDER, value: "Vultr"}
            - {name: STAGECOACH_REGION, value: ""}
            - name: STAGECOACH_TOKEN
              valueFrom: {secretKeyRef: {name: stagecoach-agent-token, key: token}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            limits:
              memory: 96Mi
            requests:
              cpu: 10m
              memory: 32Mi
