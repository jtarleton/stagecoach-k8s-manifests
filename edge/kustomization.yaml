apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stagecoach-edge
labels:
  - pairs:
      app.kubernetes.io/part-of: stagecoach
    includeSelectors: false
resources:
  - namespace.yaml
  - caddy.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: caddy-config
    files: [Caddyfile=config/Caddyfile]
  - name: cloudflare-ips
    envs: [config/cloudflare.env]
images:
  - name: localhost/stagecoach/caddy
    newTag: "202610200041-ee158ce-dirty"
