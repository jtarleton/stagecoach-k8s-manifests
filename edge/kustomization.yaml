apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stagecoach-edge
labels:
  - pairs:
      app.kubernetes.io/part-of: stagecoach
    includeSelectors: false
resources:
  - namespace.yaml
  - caddy.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: caddy-config
    files: [Caddyfile=config/Caddyfile]
  - name: cloudflare-ips
    envs: [config/cloudflare.env]
  # The Helm repository served at charts.stagecoach.sh (scripts/build-charts.sh).
  - name: helm-charts
    files:
      - charts/index.yaml
      - charts/stagecoach-agent-0.1.0.tgz
      - charts/stagecoach-agent-0.2.0.tgz
      - charts/stagecoach-agent-0.3.0.tgz
      - charts/stagecoach-agent-0.3.1.tgz
      - charts/stagecoach-0.1.0.tgz
      - charts/stagecoach-0.1.1.tgz
      - charts/stagecoach-0.1.2.tgz
images:
  - name: localhost/stagecoach/caddy
    newTag: "202610200041-ee158ce-dirty"
