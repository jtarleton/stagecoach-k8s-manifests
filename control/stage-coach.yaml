# The Stagecoach control plane (github.com/jtarleton/stagecoach): the HTTP API
# the drupal/stage_coach module calls, plus its reconcile loop and scheduler.
# In-cluster only — a ClusterIP Service, reachable from the Drupal pods at
# http://stage-coach.stage-coach.svc:8080 and nowhere else (see networkpolicy.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: stage-coach
  name: stage-coach-db
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 1Gi}
---
# Database snapshots Stagecoach takes (pre-deploy, on demand), in the site's own
# namespace so its Jobs can mount it. Separate from the nightly db-backups claim.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: stagecoach
  name: stage-coach-snapshots
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  namespace: stage-coach
  name: stage-coach
  labels: {app.kubernetes.io/name: stage-coach}
spec:
  selector: {app.kubernetes.io/name: stage-coach}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: stage-coach
  name: stage-coach
  labels: {app.kubernetes.io/name: stage-coach}
spec:
  replicas: 1
  # SQLite is a single writer: never let an old and a new pod overlap.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: stage-coach}
  template:
    metadata:
      labels: {app.kubernetes.io/name: stage-coach}
    spec:
      serviceAccountName: stage-coach
      # CI's private ghcr image; the pull secret is created by hand, not in git:
      #   kubectl -n stage-coach create secret docker-registry ghcr --docker-server=ghcr.io ...
      imagePullSecrets: [{name: ghcr}]
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532        # distroless "nonroot"
        runAsGroup: 65532
        fsGroup: 65532          # so the PVC is writable
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Register this cluster's environment before serve starts; without it
        # serve would seed the original jamestarleton.com defaults. Idempotent.
        - name: register-env
          image: ghcr.io/jtarleton/stagecoach
          imagePullPolicy: IfNotPresent
          args: [env, -db=/data/stage-coach.db, -env=prod, -rank=30,
                 -namespace=stagecoach, -host=stagecoach.sh, -prod]
          volumeMounts: [{name: db, mountPath: /data}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      containers:
        - name: stage-coach
          image: ghcr.io/jtarleton/stagecoach
          imagePullPolicy: IfNotPresent
          # The Drupal Deployment here is "drupal", its container "frankenphp".
          args: [serve, -addr=:8080, -db=/data/stage-coach.db, -workload=drupal, -container=frankenphp]
          env:
            # user:password for HTTP Basic auth on the bundled web UI.
            - name: STAGE_COACH_AUTH
              valueFrom: {secretKeyRef: {name: stage-coach, key: auth}}
            # Bearer token for /api/* and /events: what the Drupal module sends.
            - name: STAGE_COACH_API_TOKEN
              valueFrom: {secretKeyRef: {name: stage-coach, key: api-token}}
            - name: STAGE_COACH_RELEASE_TOKEN
              valueFrom: {secretKeyRef: {name: stage-coach, key: release-token, optional: true}}
            # This cluster's layout (see stagecoach docs/manual.md, "Cluster layout"):
            # Jobs borrow the drupal container's env, volumes and security
            # contexts, carry the label mariadb's NetworkPolicy admits, and keep
            # snapshots on a claim in the site's namespace (no object storage).
            - {name: STAGE_COACH_JOBS_LIKE_WORKLOAD, value: "true"}
            - {name: STAGE_COACH_JOB_LABELS, value: "stagecoach.sh/php=true"}
            - {name: STAGE_COACH_SNAPSHOT_STORE, value: "pvc://stage-coach-snapshots"}
            - {name: STAGE_COACH_MARIADB_IMAGE, value: "docker.io/library/mariadb:11.8.8"}
            - {name: GOMEMLIMIT, value: 100MiB}
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts: [{name: db, mountPath: /data}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}   # exempt from auth
            initialDelaySeconds: 3
            timeoutSeconds: 5
          # Generous: a liveness kill mid-operation abandons the operation's
          # goroutine (the Jobs survive, but the deploy's own sequencing does
          # not), and on this 1-vCPU node /healthz can miss a 1s default
          # timeout while a dump or a PHP job holds the CPU.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {memory: 160Mi}
      volumes:
        - name: db
          persistentVolumeClaim: {claimName: stage-coach-db}
