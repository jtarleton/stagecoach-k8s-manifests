# What stage-coach may do in the namespace it manages, and nothing else: read
# the grid, patch the Drupal Deployment (deploy / pin / scale), exec into its
# pods (console, drush), and create the Jobs its engine runs. It never reads
# Secrets — Jobs reference them and the kubelet resolves them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stage-coach
  namespace: stage-coach
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stage-coach
  namespace: stagecoach
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stage-coach
  namespace: stagecoach
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stage-coach
subjects:
  - kind: ServiceAccount
    name: stage-coach
    namespace: stage-coach
