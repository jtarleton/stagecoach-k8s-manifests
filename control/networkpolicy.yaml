# Only the Drupal (PHP) pods may call the Stagecoach API. Everything else is
# denied, including other pods in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: stage-coach
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: stage-coach
  name: stage-coach-from-php
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: stage-coach}
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: stagecoach}}
          podSelector: {matchLabels: {stagecoach.sh/php: "true"}}
      ports: [{port: 8080}]
---
# Copy-down prod -> dev: Stagecoach's Jobs in stagecoach-dev dump prod's
# database with a read-only user (secret stage-coach-source-stagecoach there,
# made by scripts/copy-source.sh). Only those Jobs, only to mariadb.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: stagecoach
  name: mariadb-from-dev-copy-down
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: mariadb}
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: stagecoach-dev}}
          podSelector: {matchLabels: {app.kubernetes.io/managed-by: stage-coach}}
      ports: [{port: 3306}]
---
# The stagecoach.sh agent on this cluster (agent/) reports to Stagecoach in-cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: stage-coach
  name: stage-coach-from-agent
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: stage-coach}
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: stagecoach-agent}}
          podSelector: {matchLabels: {app.kubernetes.io/name: stagecoach-agent}}
      ports: [{port: 8080}]
---
# The edge (stagecoach-edge Caddy) forwards api.stagecoach.sh/v1/agent/* here.
# Caddy only proxies that path; this lets nothing else in from the edge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: stage-coach
  name: stage-coach-from-edge
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: stage-coach}
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: stagecoach-edge}}
          podSelector: {matchLabels: {app.kubernetes.io/name: caddy}}
      ports: [{port: 8080}]
