apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stagecoach-monitor
labels:
  - pairs:
      app.kubernetes.io/part-of: stagecoach
    includeSelectors: false
resources:
  - namespace.yaml
  - uptime.yaml
configMapGenerator:
  - name: uptime-script
    files: [check.sh=config/check.sh]
