apiVersion: v1
kind: Namespace
metadata:
  name: stagecoach-monitor
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
# Nothing talks to the probe; it only calls out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: stagecoach-monitor
spec:
  podSelector: {}
  policyTypes: [Ingress]
